# Upptime for agentschmidt.com and the demos (https://upptime.js.org/docs/configuration)
owner: schmidt1024
repo: status

sites:
  - name: agentschmidt.com
    url: https://agentschmidt.com/
  - name: Demo Offertentool
    url: https://offerten.demo.agentschmidt.com/login
  - name: Demo Einsatzplanung
    url: https://einsatz.demo.agentschmidt.com/login
  # 503 when the nightly backup or demo reset did not run within 26 h (App\Support\Heartbeat)
  - name: Offertentool Backup und Reset
    url: https://offerten.demo.agentschmidt.com/up/nightly
  - name: Einsatzplanung Backup und Reset
    url: https://einsatz.demo.agentschmidt.com/up/nightly

# Alerts: GitHub opens an issue per outage and mails the repo owner (watch the repo: "All activity").
assignees:
  - schmidt1024

status-website:
  baseUrl: /status
  name: Agent Schmidt · Status
  introTitle: "Status von agentschmidt.com und den Demos"
  introMessage: Automatische Prüfung alle 5 Minuten.
  navbar:
    - title: Status
      href: /
    - title: agentschmidt.com
      href: https://agentschmidt.com

workflowSchedule:
  uptime: "*/5 * * * *"
